<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Make a Wish ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap');

:root{
  --pink:#f5aacb;
  --deep:#bd477c;
  --ink:#7c4161;
  --cream:#fff8fb;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  color:#fff;
  font-family:"DM Sans",sans-serif;
  background:#f3b2d2;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}

.scene{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  isolation:isolate;
}
.sky{
  position:absolute;
  inset:-12%;
  z-index:-10;
  background:
    radial-gradient(ellipse at 16% 12%,rgba(255,255,255,.62) 0 4%,transparent 19%),
    radial-gradient(ellipse at 84% 15%,rgba(255,231,245,.7) 0 5%,transparent 22%),
    radial-gradient(ellipse at 50% 43%,rgba(255,255,255,.2),transparent 32%),
    linear-gradient(180deg,#f8afd0 0%,#f7b8d9 39%,#edb9dc 67%,#cbb8e7 100%);
}
.cloud{
  position:absolute;
  width:45vw;height:18vw;
  min-width:320px;min-height:140px;
  border-radius:50%;
  background:rgba(255,239,248,.48);
  filter:blur(27px);
  z-index:-8;
}
.c1{left:-11vw;top:9vh;transform:rotate(-8deg)}
.c2{right:-12vw;top:25vh;opacity:.62;transform:rotate(8deg)}
.c3{left:12vw;bottom:-8vh;opacity:.62}
.c4{right:12vw;bottom:2vh;opacity:.5}
.bokeh{
  position:absolute;inset:0;z-index:-5;opacity:.75;
  background:
    radial-gradient(circle at 9% 19%,rgba(255,255,255,.58) 0 5px,transparent 6px),
    radial-gradient(circle at 24% 32%,rgba(255,255,255,.3) 0 10px,transparent 11px),
    radial-gradient(circle at 76% 17%,rgba(255,255,255,.45) 0 6px,transparent 7px),
    radial-gradient(circle at 91% 38%,rgba(255,255,255,.35) 0 12px,transparent 13px),
    radial-gradient(circle at 16% 69%,rgba(255,255,255,.3) 0 8px,transparent 9px),
    radial-gradient(circle at 84% 75%,rgba(255,255,255,.32) 0 7px,transparent 8px);
}
.grain{
  position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

.content{
  width:min(94vw,650px);
  text-align:center;
  position:relative;
  z-index:4;
  transform:translateY(-1vh);
}
.eyebrow{
  font-size:8px;
  letter-spacing:5px;
  opacity:.82;
  margin-bottom:4px;
}
h1{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(43px,9vw,72px);
  font-style:italic;
  font-weight:400;
  line-height:.84;
  text-shadow:0 6px 25px rgba(116,47,87,.18);
}
.subtitle{
  margin:12px 0 0;
  font-size:10px;
  letter-spacing:1.8px;
  opacity:.74;
}

.stage{
  position:relative;
  height:min(56vh,440px);
  min-height:320px;
  display:grid;
  place-items:center;
  margin-top:4px;
}

.glow{
  position:absolute;
  width:330px;height:210px;
  border-radius:50%;
  background:rgba(255,121,181,.25);
  filter:blur(48px);
  animation:breathe 3.5s ease-in-out infinite;
}
@keyframes breathe{
  50%{transform:scale(1.14);opacity:.78}
}

.sparkles{position:absolute;inset:0;pointer-events:none}
.spark{
  position:absolute;
  color:rgba(255,255,255,.9);
  text-shadow:0 0 14px rgba(255,255,255,.95);
  animation:sparkle 2.8s ease-in-out infinite;
}
.s1{left:18%;top:27%;font-size:15px}
.s2{right:18%;top:30%;font-size:11px;animation-delay:.8s}
.s3{left:26%;top:61%;font-size:9px;animation-delay:1.5s}
.s4{right:25%;top:63%;font-size:15px;animation-delay:2s}
.s5{left:38%;top:16%;font-size:8px;animation-delay:.4s}
.s6{right:36%;top:18%;font-size:8px;animation-delay:1.2s}
@keyframes sparkle{
  0%,100%{opacity:.25;transform:scale(.8) rotate(0)}
  50%{opacity:1;transform:scale(1.25) rotate(12deg)}
}

/* CAKE */
.cake{
  position:relative;
  width:310px;
  height:235px;
  transform:translateY(25px);
  filter:drop-shadow(0 25px 24px rgba(120,48,87,.18));
}
.plate{
  position:absolute;
  left:15px;bottom:6px;
  width:280px;height:27px;
  border-radius:50%;
  background:rgba(255,248,252,.75);
  box-shadow:0 5px 0 rgba(206,115,155,.16),0 13px 30px rgba(120,48,87,.14);
}
.layer{
  position:absolute;
  left:40px;
  width:230px;
  border-radius:14px 14px 20px 20px;
  background:linear-gradient(180deg,#fff7fb,#ffdbe9 75%,#f4a9ca);
  box-shadow:inset 0 -9px 0 rgba(204,74,126,.1);
}
.layer.bottom{bottom:27px;height:77px}
.layer.middle{bottom:88px;height:66px;left:52px;width:206px}
.layer.top{
  bottom:139px;height:57px;left:64px;width:182px;
  background:linear-gradient(180deg,#fffaff,#ffe6f0);
}
.icing{
  position:absolute;
  left:61px;bottom:178px;
  width:188px;height:25px;
  border-radius:50%;
  background:#fffafd;
  box-shadow:0 7px 0 #ffd0e2;
}
.drip{
  position:absolute;
  bottom:163px;
  width:21px;height:28px;
  border-radius:0 0 15px 15px;
  background:#fffafd;
}
.d1{left:78px}.d2{left:122px;height:21px}.d3{left:169px;height:31px}.d4{left:214px;height:19px}

.cherry{
  position:absolute;
  width:15px;height:15px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff,#e95b91 25%,#c52f6d 75%);
  box-shadow:0 3px 5px rgba(130,30,72,.18);
  z-index:3;
}
.cherry:after{
  content:"";
  position:absolute;
  width:24px;height:13px;
  left:5px;top:-10px;
  border-top:2px solid #79a16e;
  border-radius:50%;
  transform:rotate(-28deg);
}
.ch1{left:87px;bottom:193px}
.ch2{left:133px;bottom:199px}
.ch3{left:180px;bottom:190px}
.ch4{left:213px;bottom:198px}

/* CANDLE */
.candle{
  position:absolute;
  bottom:186px;
  width:20px;
  height:68px;
  border-radius:7px 7px 4px 4px;
  background:repeating-linear-gradient(
    135deg,
    #ffe0ec 0 7px,
    #f3a6c7 7px 13px
  );
  box-shadow:
    inset -4px 0 0 rgba(183,55,105,.12),
    0 4px 8px rgba(116,45,82,.13);
  z-index:7;
}
.candle1{left:50%;margin-left:-52px}
.candle2{left:50%;margin-left:-10px}
.candle3{left:50%;margin-left:32px}

.wick{
  position:absolute;
  left:50%;
  top:-9px;
  width:3px;
  height:10px;
  transform:translateX(-50%);
  background:#65464a;
  border-radius:3px;
  z-index:2;
}

.flame{
  position:absolute;
  left:50%;
  top:-47px;
  width:24px;
  height:38px;
  margin-left:-12px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  z-index:9;
  filter:drop-shadow(0 0 11px rgba(255,181,70,.72));
  animation:flame 1.15s ease-in-out infinite;
}
.flame:before{
  content:"";
  position:absolute;
  inset:2px 3px 0;
  border-radius:55% 45% 55% 45%;
  transform:rotate(45deg);
  background:linear-gradient(
    145deg,
    #fff9b0 5%,
    #ffc45d 48%,
    #f4776d 100%
  );
}
.flame:after{
  content:"";
  position:absolute;
  width:8px;
  height:15px;
  left:8px;
  top:13px;
  border-radius:50%;
  background:#fffdf1;
  filter:blur(.5px);
}
@keyframes flame{
  0%,100%{
    transform:translateX(0) scale(.95) rotate(-3deg);
  }
  50%{
    transform:translateX(0) scale(1.08) rotate(4deg);
  }
}
.flame.off{
  opacity:0;
  pointer-events:none;
  animation:none;
  transition:.25s;
}
.smoke{
  position:absolute;
  left:50%;
  top:-50px;
  width:7px;
  height:7px;
  opacity:0;
  transform:translateX(-50%);
  pointer-events:none;
}
.smoke.show{opacity:1}
.smoke i{
  position:absolute;
  left:0;
  top:0;
  width:9px;
  height:22px;
  border:2px solid rgba(255,255,255,.58);
  border-left-color:transparent;
  border-bottom-color:transparent;
  border-radius:50%;
  animation:smoke 2.3s ease-out forwards;
}

@keyframes smoke{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  15%{opacity:.8}
  100%{opacity:0;transform:translate(var(--sx),-85px) scale(1.8)}
}

.note{
  position:absolute;
  left:50%;
  bottom:0;
  width:100%;
  transform:translateX(-50%);
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:19px;
  font-style:italic;
  opacity:.92;
  transition:.6s ease;
}
.note.done{
  font-size:23px;
  transform:translateX(-50%) translateY(-4px);
}

.hint{
  margin-top:2px;
  font-size:9px;
  letter-spacing:2px;
  opacity:.68;
  transition:.5s;
}
.hint.hide{opacity:0}

.confetti{
  position:fixed;
  top:-30px;
  left:50%;
  z-index:30;
  pointer-events:none;
  animation:fall 3.2s cubic-bezier(.12,.7,.25,1) forwards;
  font-size:var(--size);
}
@keyframes fall{
  0%{transform:translate(var(--x),-30px) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translate(calc(var(--x) + var(--drift)),105vh) rotate(var(--rot));opacity:0}
}

.petal{
  position:fixed;
  top:-30px;
  z-index:28;
  pointer-events:none;
  width:10px;height:16px;
  border-radius:80% 20% 80% 20%;
  background:rgba(255,235,246,.88);
  box-shadow:0 2px 7px rgba(150,53,101,.12);
  animation:petalFall 4.5s ease-in forwards;
}
@keyframes petalFall{
  to{transform:translate(var(--drift),110vh) rotate(540deg);opacity:0}
}

.final{
  position:fixed;
  inset:0;
  z-index:45;
  display:grid;
  place-items:center;
  background:rgba(190,91,139,.18);
  backdrop-filter:blur(2px);
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}
.final.show{opacity:1;pointer-events:auto}
.final-card{
  width:min(88vw,500px);
  text-align:center;
  transform:translateY(18px) scale(.96);
  transition:1s cubic-bezier(.2,.8,.2,1);
}
.final.show .final-card{transform:translateY(0) scale(1)}
.final-card .small{
  font-size:8px;
  letter-spacing:4px;
  opacity:.78;
}
.final-card h2{
  margin:8px 0 10px;
  font:italic 400 clamp(46px,10vw,78px)/.8 "Cormorant Garamond",Georgia,serif;
  text-shadow:0 7px 28px rgba(112,43,83,.2);
}
.final-card p{
  margin:0 auto 22px;
  max-width:390px;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:19px;
  line-height:1.2;
  opacity:.9;
}
.close-final{
  border:1px solid rgba(255,255,255,.7);
  color:#7d3f61;
  background:rgba(255,255,255,.27);
  border-radius:999px;
  padding:11px 28px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}
</style>
</head>

<body>
<section class="scene">
  <div class="sky"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="bokeh"></div>

  <main class="content">
    <div class="eyebrow">A LITTLE BIRTHDAY MOMENT</div>
    <h1>Make a wish ♡</h1>
    <p class="subtitle">for someone very special</p>

    <div class="stage">
      <div class="glow"></div>

      <div class="sparkles" aria-hidden="true">
        <span class="spark s1">✦</span>
        <span class="spark s2">♡</span>
        <span class="spark s3">·</span>
        <span class="spark s4">✧</span>
        <span class="spark s5">·</span>
        <span class="spark s6">♡</span>
      </div>

      <div class="cake" aria-label="Birthday cake">
        <div class="plate"></div>

        <div class="layer bottom"></div>
        <div class="layer middle"></div>
        <div class="layer top"></div>

        <div class="icing"></div>
        <span class="drip d1"></span>
        <span class="drip d2"></span>
        <span class="drip d3"></span>
        <span class="drip d4"></span>

        <span class="cherry ch1"></span>
        <span class="cherry ch2"></span>
        <span class="cherry ch3"></span>
        <span class="cherry ch4"></span>

        <div class="candle candle1">
          <div class="wick"></div>
          <div class="flame" data-candle="1" title="Tap the flame"></div>
          <div class="smoke"><i style="--sx:-8px"></i><i style="--sx:7px"></i><i style="--sx:-3px"></i></div>
        </div>

        <div class="candle candle2">
          <div class="wick"></div>
          <div class="flame" data-candle="2" title="Tap the flame"></div>
          <div class="smoke"><i style="--sx:-8px"></i><i style="--sx:7px"></i><i style="--sx:-3px"></i></div>
        </div>

        <div class="candle candle3">
          <div class="wick"></div>
          <div class="flame" data-candle="3" title="Tap the flame"></div>
          <div class="smoke"><i style="--sx:-8px"></i><i style="--sx:7px"></i><i style="--sx:-3px"></i></div>
        </div>
      </div>

      <div class="note" id="note">Make a wish, then tap the flame ♡</div>
    </div>

    <div class="hint" id="hint">TAP ANYWHERE TO BLOW OUT THE CANDLE</div>
  </main>

  <div class="final" id="final">
    <div class="final-card">
      <div class="small">ONE MORE THING</div>
      <h2>Happy Birthday ♡</h2>
      <p>
        Hopefully all the little things you pray for will slowly find their way to becoming real.
      </p>
      <button class="close-final" id="closeFinal">Choose your gift ♡</button>
    </div>
  </div>

  <div class="grain"></div>
</section>

<script>
const flames = [...document.querySelectorAll(".flame")];
const note = document.getElementById("note");
const hint = document.getElementById("hint");
const final = document.getElementById("final");
const closeFinal = document.getElementById("closeFinal");

let blownCount = 0;
let birthdayStarted = false;

function extinguish(flame){
  if (flame.classList.contains("off")) return;

  const candle = flame.closest(".candle");
  const smoke = candle.querySelector(".smoke");

  flame.classList.add("off");
  smoke.classList.add("show");
  blownCount++;

  if (blownCount === 1) {
    note.textContent = "One candle down… ♡";
    hint.textContent = "TAP ANOTHER FLAME";
  } else if (blownCount === 2) {
    note.textContent = "Almost there… ♡";
    hint.textContent = "ONE MORE FLAME";
  } else {
    note.textContent = "Happy Birthday ♡";
    note.classList.add("done");
    hint.classList.add("hide");

    playHappyBirthday();
    burstCelebration();

    setTimeout(() => {
      final.classList.add("show");
    }, 2400);
  }
}

// Klik/tap DI MANA SAJA pada area cake untuk mematikan lilin
const cakeArea = document.querySelector(".stage");

cakeArea.addEventListener("pointerdown", (e) => {
  e.preventDefault();

  // Matikan lilin yang masih menyala, urut dari 1 → 2 → 3.
  const nextFlame = flames.find(f => !f.classList.contains("off"));
  if (nextFlame) extinguish(nextFlame);
});

/* HAPPY BIRTHDAY — Web Audio, no external MP3 required */
function playHappyBirthday(){
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if(!AudioContext) return;

  const ctx = new AudioContext();
  const now = ctx.currentTime + .08;

  const notes = [
    ["G4",.28],["G4",.28],["A4",.5],["G4",.5],["C5",.5],["B4",.9],
    ["G4",.28],["G4",.28],["A4",.5],["G4",.5],["D5",.5],["C5",.9],
    ["G4",.28],["G4",.28],["G5",.5],["E5",.5],["C5",.5],["B4",.5],["A4",.9],
    ["F5",.28],["F5",.28],["E5",.5],["C5",.5],["D5",.5],["C5",.9]
  ];

  const freq = {
    "G4":392,"A4":440,"B4":493.88,"C5":523.25,
    "D5":587.33,"E5":659.25,"F5":698.46,"G5":783.99
  };

  let t = now;

  notes.forEach(([n,d]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq[n];

    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(.105,t+.025);
    gain.gain.exponentialRampToValueAtTime(.001,t+d-.035);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(t);
    osc.stop(t+d);

    t += d;
  });

  setTimeout(() => {
    ctx.close().catch(()=>{});
  }, (t-now)*1000 + 700);
}

function burstCelebration(){
  const symbols = ["♡","♥","✦","✧","·"];

  for(let i=0;i<42;i++){
    const el = document.createElement("span");
    el.className = "confetti";
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];

    el.style.setProperty("--size",`${10+Math.random()*16}px`);
    el.style.setProperty("--x",`${(Math.random()-.5)*70}vw`);
    el.style.setProperty("--drift",`${(Math.random()-.5)*42}vw`);
    el.style.setProperty("--rot",`${Math.random()*900-450}deg`);
    el.style.animationDelay = `${Math.random()*.55}s`;

    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4200);
  }

  for(let i=0;i<24;i++){
    const p = document.createElement("span");
    p.className = "petal";

    p.style.left = `${Math.random()*100}vw`;
    p.style.animationDelay = `${Math.random()*1.1}s`;
    p.style.setProperty("--drift",`${(Math.random()-.5)*35}vw`);

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),5600);
  }
}

closeFinal.addEventListener("click",()=>{
  window.location.href = "gift.html";
});
</script>
</body>
</html>
