<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 18%,rgba(255,255,255,.72) 0 5%,transparent 18%),
    radial-gradient(circle at 85% 14%,rgba(255,226,241,.8) 0 7%,transparent 22%),
    radial-gradient(circle at 50% 38%,rgba(255,255,255,.38),transparent 30%),
    radial-gradient(circle at 18% 78%,rgba(244,190,218,.5),transparent 24%),
    radial-gradient(circle at 85% 78%,rgba(207,188,231,.45),transparent 25%),
    linear-gradient(180deg,#f8b1d2 0%,#f7b9da 36%,#edb9df 65%,#cbb9e9 100%);
  color:#7f3e62;
  font-family:"DM Sans",sans-serif;
}

/* dreamy background details */
.dreamy-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55}
.o1{width:260px;height:180px;left:-70px;top:8%;background:#fff0f7}
.o2{width:300px;height:190px;right:-90px;top:18%;background:#ffdceb}
.o3{width:330px;height:180px;left:8%;bottom:-55px;background:#e6c7e8}
.o4{width:290px;height:170px;right:8%;bottom:-45px;background:#f6d1e4}
.cloud-bg{position:absolute;width:220px;height:58px;border-radius:100px;background:rgba(255,247,251,.48);filter:blur(9px)}
.cloud-bg:before,.cloud-bg:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud-bg:before{width:85px;height:85px;left:28px;bottom:10px}
.cloud-bg:after{width:105px;height:105px;right:25px;bottom:5px}
.cb1{left:-70px;top:27%}.cb2{right:-80px;top:52%;transform:scale(1.15)}.cb3{left:20%;bottom:9%;transform:scale(.7);opacity:.5}
.spark{position:absolute;color:rgba(255,255,255,.78);text-shadow:0 0 14px rgba(255,255,255,.7);font-family:"Cormorant Garamond",serif;animation:twinkle 3.5s ease-in-out infinite}
.s1{left:9%;top:17%;font-size:20px}.s2{left:24%;top:30%;font-size:18px;animation-delay:.8s}
.s3{right:13%;top:23%;font-size:22px;animation-delay:1.4s}.s4{right:24%;top:70%;font-size:19px;animation-delay:.4s}
.s5{left:13%;bottom:24%;font-size:16px;animation-delay:1.8s}.s6{right:9%;bottom:17%;font-size:21px;animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}

.page{
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px 18px;
  position:relative;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title small{
  display:block;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#c27a91;
  margin-bottom:8px;
}

.title h1{
  font:italic 500 clamp(45px,8vw,68px)/.9 "Cormorant Garamond",serif;
  color:#a85370;
}

.title p{
  margin-top:12px;
  font-size:13px;
  color:#b8788c;
}

.hearts{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.heart{
  position:absolute;
  color:#e4a0b7;
  opacity:.55;
  animation:float 4s ease-in-out infinite;
}

.a{top:15%;left:12%}
.b{top:25%;right:12%;animation-delay:1s}
.c{bottom:18%;left:15%;animation-delay:1.8s}
.d{bottom:22%;right:17%;animation-delay:.5s}

@keyframes float{
  50%{transform:translateY(-8px)}
}

/* GIFT AREA */
.gifts{
  width:min(800px,94vw);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:clamp(12px,3vw,35px);
}

.gift{
  height:190px;
  border:0;
  background:none;
  cursor:pointer;
  position:relative;
  transition:.3s ease;
  -webkit-tap-highlight-color:transparent;
}

.gift:hover{
  transform:translateY(-7px);
}

.gift.opened{
  transform:translateY(-8px);
}

/* closed box */
.closed{
  position:absolute;
  inset:0;
  transition:.35s ease;
}

.box{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:120px;
  height:90px;
  border:2px solid #dc829f;
  border-radius:6px 6px 10px 10px;
  background:linear-gradient(90deg,#f7b6c9,#ffd1df,#f3abc1);
  box-shadow:0 10px 18px rgba(170,88,116,.13);
}

.lid{
  position:absolute;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  width:132px;
  height:27px;
  border:2px solid #dc829f;
  border-radius:6px;
  background:linear-gradient(90deg,#f3a7be,#ffd4e1,#ef9fba);
  transition:.45s cubic-bezier(.2,.8,.2,1);
  z-index:4;
}

.ribbon-v{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:17px;
  height:100%;
  background:#fff0f5;
  border-left:2px solid #dc829f;
  border-right:2px solid #dc829f;
}

.ribbon-h{
  position:absolute;
  left:0;
  bottom:35px;
  width:100%;
  height:16px;
  background:#fff0f5;
  border-top:2px solid #dc829f;
  border-bottom:2px solid #dc829f;
}

.bow{
  position:absolute;
  left:50%;
  bottom:112px;
  transform:translateX(-50%);
  width:58px;
  height:30px;
  z-index:6;
  transition:.45s cubic-bezier(.2,.8,.2,1);
}

.bow:before,.bow:after{
  content:"";
  position:absolute;
  top:2px;
  width:33px;
  height:24px;
  background:#f3a7bd;
  border:2px solid #dc829f;
  border-radius:70% 20% 70% 20%;
}

.bow:before{left:0;transform:rotate(20deg)}
.bow:after{right:0;transform:scaleX(-1) rotate(20deg)}

.knot{
  position:absolute;
  width:16px;height:16px;
  left:50%;top:8px;
  transform:translateX(-50%);
  background:#df87a2;
  border:2px solid #c96f8c;
  border-radius:50%;
  z-index:2;
}

/* opened animation */
.gift.opened .lid{
  transform:translate(-50%,-58px) rotate(-7deg);
}

.gift.opened .bow{
  transform:translate(-50%,-61px) rotate(-8deg);
}

/* contents revealed */
.inside{
  position:absolute;
  left:50%;
  bottom:27px;
  transform:translateX(-50%) scale(.35);
  width:78px;
  height:78px;
  border-radius:18px;
  background:#fff;
  border:2px solid #edb0c5;
  box-shadow:0 7px 20px rgba(169,92,118,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  opacity:0;
  z-index:3;
  transition:.45s cubic-bezier(.2,.8,.2,1);
}

.gift.opened .inside{
  opacity:1;
  transform:translate(-50%,-35px) scale(1);
}

.gift.opened .closed{
  pointer-events:none;
}

.inside small{
  position:absolute;
  bottom:-27px;
  width:150px;
  font:italic 18px "Cormorant Garamond",serif;
  color:#aa607a;
  white-space:nowrap;
}

.footer{
  margin-top:34px;
  font:italic 19px "Cormorant Garamond",serif;
  color:#bd7c92;
}

.footer span{color:#d47f9a}

/* simple popup after opening */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(255,244,249,.72);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.35s ease;
  z-index:20;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.popup{
  width:min(88vw,390px);
  background:#fffafd;
  border:1px solid #f0c5d4;
  border-radius:22px;
  padding:30px 25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(169,92,118,.15);
  transform:translateY(15px) scale(.96);
  transition:.35s ease;
}

.overlay.show .popup{
  transform:none;
}

.popup .icon{
  font-size:48px;
  margin-bottom:8px;
}

.popup h2{
  font:italic 500 38px/1 "Cormorant Garamond",serif;
  color:#a85370;
}

.popup p{
  margin:10px 0 22px;
  color:#b8788c;
  font-size:13px;
  line-height:1.5;
}

.popup button{
  border:1px solid #e2a6bb;
  background:#fff0f5;
  color:#a95c76;
  border-radius:999px;
  padding:10px 23px;
  cursor:pointer;
}

@media(max-width:650px){
  .title{margin-bottom:28px}
  .title h1{font-size:47px}
  .title p{font-size:12px}

  .gifts{
    grid-template-columns:repeat(2,1fr);
    gap:10px 18px;
    width:min(420px,95vw);
  }

  .gift{width:145px;height:145px;flex:initial}

  .box{
    width:105px;
    height:70px;
    bottom:7px;
  }

  .lid{
    width:117px;
    height:23px;
    bottom:71px;
  }

  .bow{
    bottom:88px;
    transform:translateX(-50%) scale(.82);
  }

  .ribbon-h{bottom:27px;height:14px}

  .inside{
    width:65px;height:65px;font-size:30px;
  }

  .gift.opened .inside{
    transform:translate(-50%,-25px) scale(1);
  }

  .footer{
    margin-top:20px;
    font-size:17px;
  }
}
</style>
</head>

<body>
<div class="dreamy-bg" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span>
  <span class="orb o3"></span><span class="orb o4"></span>
  <span class="cloud-bg cb1"></span><span class="cloud-bg cb2"></span><span class="cloud-bg cb3"></span>
  <span class="spark s1">✦</span><span class="spark s2">♡</span><span class="spark s3">✧</span>
  <span class="spark s4">♡</span><span class="spark s5">✦</span><span class="spark s6">✧</span>
</div>

<div class="page">

  <div class="hearts">
    <span class="heart a">♡</span>
    <span class="heart b">♡</span>
    <span class="heart c">♡</span>
    <span class="heart d">♡</span>
  </div>

  <div class="title">
    <small>a little something for you</small>
    <h1>Choose a Gift ♡</h1>
    <p>Tap a box to open it</p>
  </div>

  <div class="gifts">

    <!-- KADO 1 -->
    <button class="gift" onclick="openGift(this,1)" aria-label="Open gift">
      <div class="inside">🎮<small>a little game</small></div>
      <div class="closed">
        <div class="bow"><div class="knot"></div></div>
        <div class="lid"></div>
        <div class="box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>
    </button>

    <!-- KADO 2 -->
    <button class="gift" onclick="openGift(this,2)" aria-label="Open gift">
      <div class="inside">💌<small>a little letter</small></div>
      <div class="closed">
        <div class="bow"><div class="knot"></div></div>
        <div class="lid"></div>
        <div class="box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>
    </button>

    <!-- KADO 3 -->
    <button class="gift" onclick="openGift(this,3)" aria-label="Open gift">
      <div class="inside">📷<small>little memories</small></div>
      <div class="closed">
        <div class="bow"><div class="knot"></div></div>
        <div class="lid"></div>
        <div class="box">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>
      </div>
    </button>
  </div>

  <div class="footer">
    every gift has a little piece of my heart <span>♡</span>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="icon" id="popupIcon">♡</div>
    <h2 id="popupTitle">A little surprise</h2>
    <p id="popupText">Something special is waiting for you.</p>
    <button onclick="goToGift()">Open it ♡</button>
  </div>
</div>

<script>
let selectedGift = null;

function openGift(element, number){
  if(element.classList.contains("opened")) return;

  element.classList.add("opened");
  selectedGift = number;

  // Isi kado muncul dulu.
  setTimeout(() => {
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const text = document.getElementById("popupText");

    const data = {
      1:{
        icon:"🎮",
        title:"A little game",
        text:"I've prepared something small for you to play ♡"
      },
      2:{
        icon:"💌",
        title:"A little letter",
        text:"There are some words I've saved special for you ♡"
      },
      3:{
        icon:"📷",
        title:"Little memories",
        text:"Some memories I want to show again♡"
      },
    };

    icon.textContent = data[number].icon;
    title.textContent = data[number].title;
    text.textContent = data[number].text;

    document.getElementById("overlay").classList.add("show");
  }, 500);
}

function goToGift(){
  if(selectedGift === 1){
    window.location.href = "game.html";
  }else if(selectedGift === 2){
    window.location.href = "paper.html";
  }else if(selectedGift === 3){
    window.location.href = "photo.html";
  }else if(selectedGift === 4){
  }
}
</script>

</body>
</html>
