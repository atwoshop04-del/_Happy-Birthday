<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5b5d3">
<title>For NIEL — Heartbeat</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap');

:root{
  --pink:#f7a8c9;
  --deep:#c73b78;
  --ink:#7f3e62;
  --white:#fffaff;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:#f5b5d3;
  color:#fff;
  -webkit-font-smoothing:antialiased;
  font-family:"DM Sans",sans-serif;
}
button{font:inherit}

/* ---------- COMMON DREAMY BACKGROUND ---------- */
.screen{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:grid;
  place-items:center;
  isolation:isolate;
}
.sky{
  position:absolute;
  inset:-10%;
  z-index:-5;
  background:
    radial-gradient(ellipse at 12% 12%,rgba(255,255,255,.58) 0 4%,transparent 18%),
    radial-gradient(ellipse at 83% 11%,rgba(255,235,248,.65) 0 5%,transparent 20%),
    radial-gradient(ellipse at 53% 38%,rgba(255,255,255,.22),transparent 30%),
    linear-gradient(180deg,#f8b1d2 0%,#f7b9da 35%,#edb9df 62%,#cbb9e9 100%);
}
.cloud{
  position:absolute;
  z-index:-4;
  width:44vw;
  height:19vw;
  min-width:330px;
  min-height:145px;
  border-radius:50%;
  background:rgba(255,236,247,.5);
  filter:blur(25px);
  opacity:.82;
}
.c1{left:-10vw;top:12vh;transform:rotate(-7deg)}
.c2{right:-12vw;top:26vh;transform:rotate(8deg);opacity:.62}
.c3{left:17vw;bottom:-7vh;opacity:.7}
.c4{right:15vw;bottom:2vh;opacity:.55}

.bokeh{
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 10% 18%,rgba(255,255,255,.55) 0 5px,transparent 6px),
    radial-gradient(circle at 27% 31%,rgba(255,255,255,.32) 0 10px,transparent 11px),
    radial-gradient(circle at 73% 18%,rgba(255,255,255,.45) 0 6px,transparent 7px),
    radial-gradient(circle at 89% 36%,rgba(255,255,255,.38) 0 12px,transparent 13px),
    radial-gradient(circle at 18% 68%,rgba(255,255,255,.3) 0 8px,transparent 9px),
    radial-gradient(circle at 82% 73%,rgba(255,255,255,.32) 0 7px,transparent 8px);
  opacity:.8;
}

.grain{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  opacity:.06;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

/* ---------- FIRST SCREEN ---------- */
#home{transition:opacity .75s ease,transform .85s cubic-bezier(.2,.8,.2,1)}
.home-inner{
  width:min(92vw,760px);
  text-align:center;
  position:relative;
  z-index:2;
  transform:translateY(-2vh);
}
.eyebrow{
  font-size:8px;
  letter-spacing:5px;
  opacity:.88;
  margin-bottom:5px;
}
.title{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:400;
  font-style:italic;
  font-size:clamp(29px,5.4vw,42px);
  line-height:.9;
  text-shadow:0 4px 18px rgba(132,49,91,.2);
}
.ornament{
  width:60px;height:12px;margin:6px auto 0;
  position:relative;opacity:.72;
}
.ornament:before,.ornament:after{
  content:"";position:absolute;top:7px;width:30px;height:1px;
  background:rgba(255,255,255,.75);
}
.ornament:before{left:0}.ornament:after{right:0}
.ornament span{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  font-size:13px;
}

.heart-stage{
  width:min(82vw,520px);
  height:min(56vh,400px);
  min-height:275px;
  margin:0 auto;
  position:relative;
  display:grid;
  place-items:center;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.glow{
  position:absolute;
  width:230px;height:180px;
  border-radius:50%;
  background:rgba(255,129,183,.28);
  filter:blur(45px);
  animation:breath 3.2s ease-in-out infinite;
}
@keyframes breath{
  50%{transform:scale(1.18);opacity:.72}
}
.orbit{
  position:absolute;
  width:265px;height:265px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  box-shadow:0 0 30px rgba(255,255,255,.15);
}
.orbit:before,.orbit:after{
  content:"";position:absolute;border-radius:50%;
  background:#fff;box-shadow:0 0 10px #fff;
}
.orbit:before{width:4px;height:4px;left:17%;top:23%}
.orbit:after{width:3px;height:3px;right:15%;bottom:24%}

.heart{
  width:min(49vw,245px);
  height:min(45vw,220px);
  position:relative;
  transform-origin:center;
  transition:transform .55s cubic-bezier(.16,1.2,.25,1),opacity .25s;
  filter:drop-shadow(0 17px 20px rgba(174,40,100,.16))
         drop-shadow(0 0 24px rgba(255,168,207,.3));
  z-index:4;
}
.heart svg{width:100%;height:100%;overflow:visible}

.float{
  position:absolute;
  z-index:3;
  color:rgba(255,249,253,.9);
  font-family:Georgia,serif;
  text-shadow:0 0 15px rgba(255,255,255,.8);
  animation:float 4.5s ease-in-out infinite;
}
.f1{left:24%;top:33%;font-size:17px}
.f2{right:22%;top:39%;font-size:22px;animation-delay:1.1s}
.f3{left:32%;top:15%;font-size:13px;animation-delay:2s}
.f4{right:32%;top:17%;font-size:14px;animation-delay:.6s}
.f5{left:20%;top:55%;font-size:11px;animation-delay:2.5s}
.f6{right:19%;top:57%;font-size:11px;animation-delay:1.7s}
@keyframes float{
  50%{transform:translateY(-15px) rotate(9deg)}
}

.prompt{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:14px;
  font-style:italic;
  opacity:.9;
  margin-top:-2px;
  text-shadow:0 2px 10px rgba(120,45,90,.15);
}
.dots{
  margin-top:8px;
  font:9px "DM Sans",sans-serif;
  letter-spacing:4px;
  opacity:.65;
}


/* ===== ORBIT LINGKARAN DI TENGAH ===== */
.love-orbit{
  position:absolute;
  left:50%;
  top:50%;
  width:300px;
  height:300px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
  z-index:6;
  animation:circleOrbit 9s linear infinite;
}
.love-orbit .mini-love{
  --angle:0deg;
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  margin:-15px;
  display:grid;
  place-items:center;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:23px;
  line-height:1;
  text-shadow:0 0 9px rgba(255,255,255,.9),
              0 2px 8px rgba(184,50,108,.22);

  /* Posisi di lingkaran, tetapi LOVE-nya selalu tegak */
  transform:
    translate(-50%,-50%)
    rotate(var(--angle))
    translateY(-150px)
    rotate(calc(var(--angle) * -1));
}

/* Satu gerakan melingkar penuh */
@keyframes circleOrbit{
  from{
    transform:translate(-50%,-50%) rotate(0deg);
  }
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

/* Sedikit variasi ukuran supaya tidak terlalu kaku */
.love-orbit .m1{--angle:0deg;font-size:25px}
.love-orbit .m2{--angle:72deg;font-size:20px}
.love-orbit .m3{--angle:144deg;font-size:24px}
.love-orbit .m4{--angle:216deg;font-size:19px}
.love-orbit .m5{--angle:288deg;font-size:22px}

/* Saat heart membesar, orbit ikut melebar sedikit */
.heart-stage.growing .love-orbit{
  width:330px;
  height:330px;
  animation-duration:7.5s;
}

/* ---------- EXPLOSION ---------- */
.particle{
  position:fixed;
  left:50%;top:50%;
  z-index:40;
  pointer-events:none;
  font-family:Arial,sans-serif;
  color:#ff4f96;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.8));
  animation:explode .9s cubic-bezier(.08,.75,.16,1) forwards;
}
@keyframes explode{
  0%{transform:translate(-50%,-50%) scale(.15) rotate(0);opacity:0}
  12%{opacity:1}
  100%{
    transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)))
      rotate(var(--r)) scale(var(--s));
    opacity:0;
  }
}
.flash{
  position:fixed;inset:0;background:#fff;z-index:50;
  pointer-events:none;opacity:0;
}
.flash.active{animation:flash .8s ease forwards}
@keyframes flash{
  0%{opacity:0}18%{opacity:.72}100%{opacity:0}
}


/* ---------- PASSWORD SCREEN ---------- */
#password{
  opacity:0;
  pointer-events:none;
  transform:scale(1.035);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);
}
#password.show{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}
.lock-inner{
  width:min(90vw,500px);
  text-align:center;
  position:relative;
  z-index:3;
}
.lock-icon{
  font-size:28px;
  margin-bottom:14px;
  filter:drop-shadow(0 4px 12px rgba(150,50,100,.18));
}
.lock-title{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(38px,8vw,58px);
  font-style:italic;
  font-weight:400;
  line-height:.9;
  text-shadow:0 4px 18px rgba(125,50,95,.18);
}
.lock-sub{
  margin:18px auto 22px;
  font-size:11px;
  letter-spacing:1.5px;
  opacity:.75;
}
.password-box{
  width:min(82vw,330px);
  margin:auto;
  position:relative;
}
.password-input{
  width:100%;
  height:48px;
  border:1px solid rgba(255,255,255,.72);
  outline:none;
  border-radius:999px;
  background:rgba(255,255,255,.25);
  color:#783b5e;
  text-align:center;
  font:16px "DM Sans",sans-serif;
  padding:0 52px 0 20px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(120,50,100,.09);
}
.password-input::placeholder{
  color:rgba(120,59,94,.5);
}
.password-input:focus{
  background:rgba(255,255,255,.38);
  border-color:rgba(255,255,255,.95);
}
.unlock{
  margin-top:14px;
  border:1px solid rgba(255,255,255,.78);
  background:rgba(255,255,255,.3);
  color:#7d3d60;
  border-radius:999px;
  padding:12px 31px;
  cursor:pointer;
  box-shadow:0 9px 24px rgba(115,48,95,.1);
  transition:.2s ease;
}
.unlock:hover{background:rgba(255,255,255,.46);transform:translateY(-1px)}
.unlock:active{transform:scale(.96)}
.error{
  height:18px;
  margin-top:10px;
  font-size:10px;
  color:#a94370;
  opacity:0;
  transition:opacity .2s;
}
.error.show{opacity:.9}
.shake{animation:shake .38s ease}
@keyframes shake{
  20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}

/* ---------- SECOND SCREEN ---------- */
#next{
  opacity:0;
  pointer-events:none;
  transform:scale(1.035);
  transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1);
}
#next.show{opacity:1;pointer-events:auto;transform:scale(1)}
.sunset{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 72%,rgba(255,220,180,.72) 0 5%,transparent 25%),
    linear-gradient(180deg,rgba(255,191,215,.05),rgba(177,178,222,.18));
  z-index:-1;
}
.horizon{
  position:absolute;
  width:100%;
  height:24%;
  bottom:0;
  background:
    linear-gradient(to top,rgba(144,139,201,.35),transparent),
    radial-gradient(ellipse at 50% 15%,rgba(255,225,194,.35),transparent 45%);
  z-index:-1;
}
.next-inner{
  width:min(92vw,720px);
  text-align:center;
}
.special{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;
  font-weight:400;
  font-size:clamp(50px,10vw,82px);
  line-height:.76;
  text-shadow:0 7px 30px rgba(120,54,103,.16);
}
.thanks{
  margin-top:25px;
  font-size:8px;
  letter-spacing:4px;
  opacity:.72;
}
.next-btn{
  margin-top:28px;
  border:1px solid rgba(255,255,255,.78);
  background:rgba(255,255,255,.23);
  color:#844363;
  padding:13px 38px;
  border-radius:999px;
  cursor:pointer;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 28px rgba(105,52,100,.12);
  transition:.2s ease;
}
.next-btn:hover{background:rgba(255,255,255,.42);transform:translateY(-1px)}
.next-btn:active{transform:scale(.96)}
</style>
</head>

<body>

<section class="screen" id="home">
  <div class="sky"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="bokeh"></div>

  <main class="home-inner">
    <div class="eyebrow">HEARTBEAT</div>
    <h1 class="title">For NIEL</h1>
    <div class="ornament"><span>♡</span></div>

    <div class="heart-stage" id="heartStage" aria-label="Tekan hati">
      <div class="glow"></div>
      <div class="orbit" style="opacity:.08"></div>

      <span class="float f1">♡</span>
      <span class="float f2">♡</span>
      <span class="float f3">♡</span>
      <span class="float f4">♡</span>
      <span class="float f5">♡</span>
      <span class="float f6">♡</span>


      <div class="love-orbit" aria-hidden="true">
        <span class="mini-love m1">♡</span>
        <span class="mini-love m2">♡</span>
        <span class="mini-love m3">♡</span>
        <span class="mini-love m4">♡</span>
        <span class="mini-love m5">♡</span>
      </div>

      <div class="heart" id="heart">
        <svg viewBox="0 0 240 220" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="18%" y1="8%" x2="82%" y2="94%">
              <stop offset="0" stop-color="#fffafc"/>
              <stop offset=".16" stop-color="#ffe6ef"/>
              <stop offset=".40" stop-color="#ffb7d0"/>
              <stop offset=".67" stop-color="#f879aa"/>
              <stop offset="1" stop-color="#db3b78"/>
            </linearGradient>
            <radialGradient id="shine" cx="32%" cy="22%" r="65%">
              <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
              <stop offset=".35" stop-color="#fff" stop-opacity=".24"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <filter id="wash" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="4" seed="12" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
            </filter>
            <filter id="softGlow">
              <feGaussianBlur stdDeviation="1.8" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <path filter="url(#wash)"
            d="M120 202
               C106 190 25 139 25 70
               C25 34 51 15 79 15
               C97 15 111 25 120 43
               C129 25 143 15 161 15
               C189 15 215 34 215 70
               C215 139 134 190 120 202Z"
            fill="url(#hg)" stroke="#fff" stroke-opacity=".72" stroke-width="2.5"/>

          <path
            d="M120 187
               C101 171 42 132 42 75
               C42 48 58 32 80 32
               C96 32 108 42 120 62
               C132 42 144 32 160 32
               C182 32 198 48 198 75
               C198 132 139 171 120 187Z"
            fill="url(#shine)" opacity=".9"/>

          <path d="M67 60 C78 39 99 43 107 61"
                fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="8"
                stroke-linecap="round" filter="url(#softGlow)"/>

          <ellipse cx="77" cy="91" rx="25" ry="16"
                   fill="#fff" opacity=".10" transform="rotate(-28 77 91)"/>
          <ellipse cx="157" cy="119" rx="35" ry="19"
                   fill="#c91d68" opacity=".055" transform="rotate(-20 157 119)"/>
          <circle cx="120" cy="160" r="22" fill="#ff4f98" opacity=".05"/>
        </svg>
      </div>
    </div>

    <div class="prompt" id="prompt">Tap the heart</div>
    <div class="dots" id="dots">• • •</div>
  </main>
  <div class="grain"></div>
</section>


<!-- PASSWORD -->
<section class="screen" id="password">
  <div class="sky"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="bokeh"></div>

  <main class="lock-inner">
    <div class="lock-icon">♡</div>
    <h2 class="lock-title">A little secret</h2>
    <div class="lock-sub">ENTER THE PASSWORD TO CONTINUE</div>

    <div class="password-box" id="passwordBox">
      <input
        class="password-input"
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="off"
        aria-label="Password"
      >
      <button class="unlock" id="unlockBtn">Unlock ♡</button>
      <div class="error" id="passwordError">Hmm… password-nya belum tepat ♡</div>
    </div>
  </main>
  <div class="grain"></div>
</section>

<section class="screen" id="next">
  <div class="sky"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="bokeh"></div>
  <div class="sunset"></div>
  <div class="horizon"></div>

  <main class="next-inner">
    <div class="special">You're<br>Special</div>
    <div class="thanks">THANK YOU FOR BEING HERE ♡</div>
    <button class="next-btn" id="nextBtn">Next&nbsp; →</button>
  </main>
  <div class="grain"></div>
</section>

<div class="flash" id="flash"></div>

<script>
const stage = document.getElementById("heartStage");
const heart = document.getElementById("heart");
const prompt = document.getElementById("prompt");
const dots = document.getElementById("dots");
const home = document.getElementById("home");
const passwordScreen = document.getElementById("password");
const passwordInput = document.getElementById("passwordInput");
const passwordBox = document.getElementById("passwordBox");
const passwordError = document.getElementById("passwordError");
const unlockBtn = document.getElementById("unlockBtn");
const next = document.getElementById("next");
const flash = document.getElementById("flash");
const nextBtn = document.getElementById("nextBtn");

// Ganti password di sini.
const CORRECT_PASSWORD = "2609";

let taps = 0;
let locked = false;

stage.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (locked) return;

  taps++;
  const scale = [1.15, 1.55, 2.02][Math.min(taps - 1, 2)];
  heart.style.transform = `scale(${scale})`;
  stage.classList.toggle("growing", taps > 0);

  if (taps === 1) {
    prompt.textContent = "Again… ♡";
    dots.textContent = "♥ • •";
  } else if (taps === 2) {
    prompt.textContent = "One more…";
    dots.textContent = "♥ ♥ •";
  } else {
    dots.textContent = "♥ ♥ ♥";
    explode();
  }
});

function explode() {
  locked = true;
  prompt.textContent = "";
  heart.style.opacity = "0";
  document.querySelectorAll(".love-orbit .mini-love").forEach((el, i) => {
    const angle = (i / 5) * Math.PI * 2;
    const distance = 190 + Math.random() * 130;
    el.style.transition = "transform .7s cubic-bezier(.12,.8,.18,1), opacity .7s";
    el.style.opacity = "0";
    el.style.transform =
      `translate(calc(-50% + ${Math.cos(angle)*distance}px), calc(-50% + ${Math.sin(angle)*distance}px)) scale(1.5)`;
  });

  const symbols = ["♥","♡","♥","♡","❤","✦","·"];
  const count = 68;

  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];

    const a = Math.random() * Math.PI * 2;
    const d = 90 + Math.random() * Math.min(innerWidth, innerHeight) * .68;
    p.style.setProperty("--x", `${Math.cos(a)*d}px`);
    p.style.setProperty("--y", `${Math.sin(a)*d}px`);
    p.style.setProperty("--s", `${.45 + Math.random()*1.65}`);
    p.style.setProperty("--r", `${Math.random()*900-450}deg`);
    p.style.fontSize = `${10 + Math.random()*22}px`;
    p.style.animationDelay = `${Math.random()*.16}s`;

    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1150);
  }

  flash.classList.add("active");

  setTimeout(() => {
    home.style.opacity = "0";
    home.style.transform = "scale(1.045)";
    passwordScreen.classList.add("show");
    setTimeout(() => passwordInput.focus(), 500);
  }, 620);
}


function unlockPassword(){
  const value = passwordInput.value.trim();

  if(value.toLowerCase() === CORRECT_PASSWORD.toLowerCase()){
    passwordError.classList.remove("show");
    passwordInput.blur();
    passwordScreen.style.opacity = "0";
    passwordScreen.style.transform = "scale(1.035)";

    setTimeout(() => {
      window.location.href = "cake.html";
    }, 650);
  }else{
    passwordError.classList.add("show");
    passwordBox.classList.remove("shake");
    void passwordBox.offsetWidth;
    passwordBox.classList.add("shake");
    passwordInput.value = "";
    passwordInput.focus();
  }
}

unlockBtn.addEventListener("click", unlockPassword);

passwordInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") unlockPassword();
});

nextBtn.addEventListener("click", () => {
  // Untuk sementara kembali ke halaman awal.
  // Nanti bisa diganti dengan halaman ketiga.
  location.reload();
});
</script>
